# 푸시할 때마다 back · front 단위 테스트를 실행한다. 실패 메일은 GitHub 가 푸시한 사람에게 보낸다.
# job 이름(back-test · front-test)은 main 룰셋의 필수 검사 이름이므로 바꾸면 룰셋도 같이 바꾼다.
# paths 필터를 넣지 않는다. 검사가 생략된 커밋은 필수 검사가 끝나지 않아 main 에 머지할 수 없다.
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  back-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Elasticsearch 는 띄우지 않는다. 없어도 서버는 뜨고 차량 색인만 건너뛴다 (VehicleSearchIndexer)
      - name: MySQL 시작
        run: docker compose up -d --wait db

      - name: 테스트 실행
        working-directory: back
        run: ./gradlew test

      - name: 실패한 테스트 보고서 저장
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: back-test-report
          path: back/build/reports/tests/test

  front-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: 의존성 설치
        working-directory: front
        run: npm ci

      - name: 테스트 실행
        working-directory: front
        run: npm test
